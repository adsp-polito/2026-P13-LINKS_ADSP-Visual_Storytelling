name: Task
description: A unit of work (code, notebook, docs)
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [data, model, eval, infra, docs]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      placeholder: |
        - [ ] writes data/processed/vist_val.jsonl that passes validate_file
        - [ ] tests added
  - type: textarea
    id: notes
    attributes:
      label: Notes / dependencies
