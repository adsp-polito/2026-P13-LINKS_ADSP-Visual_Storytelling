name: Bug
description: Something is broken
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: "p13-generate --config configs/e0_zeroshot.yaml --set ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, GPU + VRAM, Python, torch / transformers versions, commit hash.
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
