# E0 – zero-shot baseline (adapter OFF). Default: P0 and P1 on VIST val dev-200.
# One run per dataset and split (id lists: data/README.md), e.g. VWP dev (from train):
#   --set "data.datasets=[vwp]" --set data.split=train --set data.subset=dev200
# Full split: --set data.subset=full
experiment:
  id: E0
  name: zeroshot_2b
  seed: 42

model:
  name: Qwen/Qwen3-VL-2B-Instruct
  load_in_4bit: false          # true on a 6 GB GPU
  dtype: bfloat16
  adapter: null                # zero-shot: no adapter

data:
  datasets: [vist]             # one dataset per run: see the header
  split: val
  max_image_side: 448
  subset: dev200

prompt:
  ids: [P0, P1]

generation:
  max_new_tokens: 256
  do_sample: false
  batch_size: 1
  backend: transformers

logging:
  wandb: false
