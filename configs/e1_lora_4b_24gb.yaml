# E1 – first adaptation run, sized for a 24 GB GPU.
# Plain LoRA in bf16 (no quantisation); base model frozen, only adapters train.
experiment:
  id: E1
  name: lora_4b_24gb
  seed: 42

model:
  name: Qwen/Qwen3-VL-4B-Instruct
  load_in_4bit: false
  dtype: bfloat16
  attn_implementation: sdpa

data:
  datasets: [vist]
  split: val
  max_image_side: 448
  subset: dev200

prompt:
  ids: [P1]
  train_id: P1

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  train_vision_tower: false

train:
  per_device_batch_size: 4
  grad_accum: 4               # effective batch 16 (same as the 6 GB config)
  learning_rate: 2.0e-4
  epochs: 1
  gradient_checkpointing: true
  max_seq_len: 2048

logging:
  wandb: false

hub:
  push_adapter: false
  repo_id: null
  private: true
